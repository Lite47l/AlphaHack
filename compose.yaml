# Запуск: docker compose up --build   (UI: http://localhost:3000, API-шлюз: http://localhost:8080)
# Файл .env не обязателен: без него LLM выключена и инсайты строятся правилами.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hackathon?sslmode=disable
      DATA_DIR: /data
      STATE_DIR: /state
      RAW_DATA_DIR: /data/raw
      SEGMENT_MIN_REVENUE: ${SEGMENT_MIN_REVENUE:-5000000000}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_PLANNER: ${LLM_MODEL_PLANNER:-z-ai/glm-5.3-flash}
      LLM_MODEL_EXTRACTOR: ${LLM_MODEL_EXTRACTOR:-google/gemma-4-26b-a4b-it}
      LLM_MODEL_WRITER: ${LLM_MODEL_WRITER:-qwen/qwen3.6-35b-a3b}
      LLM_MODEL_CHAT: ${LLM_MODEL_CHAT:-qwen/qwen3.6-35b-a3b}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-1500000}
    volumes:
      - ./data:/data:ro
      - ai_state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hackathon?sslmode=disable
      AI_URL: http://ai:8000
      NEWS_FEEDS: ${NEWS_FEEDS:-}
      NEWS_IMPORT_INTERVAL: ${NEWS_IMPORT_INTERVAL:-30m}
      NEWS_IMPORT_ON_START: ${NEWS_IMPORT_ON_START:-true}
      NEWS_SNAPSHOT_PATH: /data/news_snapshot.json
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      FETCH_ALLOW_CIDRS: ${FETCH_ALLOW_CIDRS:-}
    volumes:
      - ./data:/data:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  ai_state:
